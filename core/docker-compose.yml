services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: otherworld
      POSTGRES_PASSWORD: otherworld
      POSTGRES_DB: otherworld
    ports:
      - "5432:5432"
    volumes:
      - otherworld_pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otherworld"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local T6.1/T6.2 run: `docker compose --profile app up --build`. Profile keeps
  # plain `docker compose up` (dev deps only) behaving as before.
  migrate:
    profiles: [app]
    build: .
    command: alembic upgrade head
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgresql+asyncpg://otherworld:otherworld@postgres:5432/otherworld
      DATABASE_URL_SYNC: postgresql+psycopg://otherworld:otherworld@postgres:5432/otherworld
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:8000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    profiles: [app]
    build: .
    command: uvicorn otherworld.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *appenv
    ports:
      - "8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    profiles: [app]
    build: .
    command: python -m otherworld.worker
    env_file: .env
    environment: *appenv
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  otherworld_pg:
