services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: otherworld
      POSTGRES_PASSWORD: otherworld
      POSTGRES_DB: otherworld
    ports:
      - "5432:5432"
    volumes:
      - otherworld_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otherworld"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  otherworld_pg:
